name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_TYPE -eq "tag" -and "v$version" -ne $env:GITHUB_REF_NAME) {
            Write-Error "Cargo.toml says $version but the tag is $env:GITHUB_REF_NAME"
            exit 1
          }
          "number=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        run: cargo build --release --locked

      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=${{ steps.version.outputs.number }}" packaging\windows\trame.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\trame.exe, target\installer\*.exe dist

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the drivers and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers fontconfig fonts-dejavu-core

      - name: Test
        run: cargo test --locked --no-fail-fast

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the display and drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers fontconfig fonts-dejavu-core

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          cargo deb --no-build --locked
          cargo generate-rpm
          mkdir dist
          cp target/debian/*.deb target/generate-rpm/*.rpm dist/

      - name: Install the .deb and open trame
        run: |
          sudo apt-get install -y ./dist/*.deb
          xvfb-run -a trame > trame.log 2>&1 &
          for _ in $(seq 30); do
            pid=$(pgrep -x trame) && pgrep -P "$pid" > /dev/null && break
            sleep 1
          done
          sleep 3
          cat trame.log
          pgrep -P "$pid"
          kill "$pid"

      - name: Install the .rpm on Fedora
        run: docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest sh -c 'dnf install -y /dist/*.rpm && test -x /usr/bin/trame'

      - name: Let an older copy fetch the latest release
        run: |
          sudo apt-get install -y policykit-1
          perl -0pi -e 's/^version = ".*?"/version = "0.0.1"/m' Cargo.toml
          cargo build --release
          cargo deb --no-build --output old.deb
          git checkout Cargo.toml Cargo.lock
          sudo apt-get install -y --allow-downgrades ./old.deb
          xvfb-run -a trame > old.log 2>&1 &
          for _ in $(seq 90); do
            ls ~/.cache/trame/update/*.deb 2> /dev/null && break
            sleep 1
          done
          pkill -x trame || true
          cat old.log
          sudo apt-get install -y ~/.cache/trame/update/*.deb
          dpkg-query -W trame
          test "$(dpkg-query -W -f='${Version}' trame)" != 0.0.1-1

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: cargo test --locked --no-fail-fast

      - name: Build for Apple Silicon and Intel
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create -output trame-universal \
            target/aarch64-apple-darwin/release/trame \
            target/x86_64-apple-darwin/release/trame

      - name: Make trame.app
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          mkdir dist
          sh packaging/macos/bundle.sh trame-universal "$version" build
          ditto -c -k --keepParent build/trame.app "dist/trame-$version-macos.zip"

      - name: Open trame
        run: |
          open build/trame.app
          for _ in $(seq 30); do
            pid=$(pgrep -f trame.app/Contents/MacOS/trame) && pgrep -P "$pid" > /dev/null && break
            sleep 1
          done
          pgrep -P "$pid"
          kill "$pid"

      - name: Let an older copy replace itself with the latest release
        run: |
          perl -0pi -e 's/^version = ".*?"/version = "0.0.1"/m' Cargo.toml
          cargo build --release --target aarch64-apple-darwin
          git checkout Cargo.toml Cargo.lock
          sh packaging/macos/bundle.sh target/aarch64-apple-darwin/release/trame 0.0.1 old
          open old/trame.app
          for _ in $(seq 90); do
            test -d old/trame.app.old && break
            sleep 1
          done
          pkill -f old/trame.app/Contents/MacOS/trame || true
          ls -a old
          plutil -p old/trame.app/Contents/Info.plist | grep CFBundleShortVersionString
          test -d old/trame.app.old
          ! grep -q '>0.0.1<' old/trame.app/Contents/Info.plist

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [windows, test, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "trame $GITHUB_REF_NAME" --generate-notes
