[package]
name = "trame"
version = "0.3.6"
edition = "2024"
rust-version = "1.87"
description = "A light terminal with instances, tabs and splits"
license = "MIT"
authors = ["Florent Leterme <letermeflorent@gmail.com>"]
repository = "https://github.com/LetermeFlorent/trame"
homepage = "https://github.com/LetermeFlorent/trame"

[lib]
path = "src/lib.rs"

[[bin]]
name = "trame"
path = "src/main.rs"

[features]
capture = []

[dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl"] }
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
swash = "0.2.10"
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs", "memmap", "fontconfig"] }
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.2"
png = "0.18.1"

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "vulkan"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["metal"] }

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan", "gles"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[package.metadata.deb]
section = "x11"
priority = "optional"
license-file = ["LICENSE", "0"]
extended-description = "trame groups shells into instances in a side bar, with tabs and splits in each instance. It follows the light or dark theme of the system, opens the default shell of the system and reopens the last layout at launch."
depends = "$auto, fontconfig, libxkbcommon0, libvulkan1 | libegl1"
recommends = "libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxrandr2, libwayland-client0, libwayland-cursor0"
assets = [
    ["target/release/trame", "usr/bin/", "755"],
    ["packaging/linux/trame.desktop", "usr/share/applications/", "644"],
    ["assets/logo-256.png", "usr/share/icons/hicolor/256x256/apps/trame.png", "644"],
    ["assets/logo-512.png", "usr/share/icons/hicolor/512x512/apps/trame.png", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/trame", dest = "/usr/bin/trame", mode = "755" },
    { source = "packaging/linux/trame.desktop", dest = "/usr/share/applications/trame.desktop", mode = "644" },
    { source = "assets/logo-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/trame.png", mode = "644" },
    { source = "assets/logo-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/trame.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/trame/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
fontconfig = "*"
libxkbcommon = "*"
"(vulkan-loader or mesa-libEGL)" = ""

[package.metadata.generate-rpm.recommends]
libxkbcommon-x11 = "*"
libX11 = "*"
libX11-xcb = "*"
libXcursor = "*"
libXi = "*"
libXrandr = "*"
libwayland-client = "*"
libwayland-cursor = "*"

[lints.clippy]
too_many_lines = "warn"
