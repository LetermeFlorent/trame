[package]
name = "trame"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "A light terminal with instances, tabs and splits"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "trame"
path = "src/main.rs"

[features]
capture = ["dep:png"]

[dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12", "metal", "vulkan", "gles"] }
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
swash = "0.2.10"
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs", "memmap", "fontconfig"] }
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.2"
png = { version = "0.18.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
png = "0.18.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[lints.clippy]
too_many_lines = "warn"
